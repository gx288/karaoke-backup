name: Karaoke Backup Automation

on:
  schedule:
    # Chạy mỗi 2 tiếng 1 lần
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Cho phép trigger chạy bằng tay từ giao diện GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install ffmpeg
      run: sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create credentials from secrets
      env:
        GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
      run: |
        # Lưu cookies ra file nếu có
        if [ -n "$COOKIES_TXT" ]; then
          echo "$COOKIES_TXT" > cookies.txt
        fi
        
    - name: Run Backup Script
      env:
        GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        SOURCE_PLAYLIST_IDS: "PLZC4gKOl6VcPQ3fK-mWst_X7SarnU-rj_,PLZC4gKOl6VcPLhQjpZT7rxoJe1yEaNHYw"
        TARGET_PLAYLIST_ID: ${{ secrets.TARGET_PLAYLIST_ID }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: python main.py
